name: ci-debug-seed

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: medini
          POSTGRES_PASSWORD: medini_dev_password
          POSTGRES_DB: medini_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medini -d medini_dev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Probe set_config via psql (pre-migration)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          PGPASSWORD=medini_dev_password psql -h localhost -U medini -d medini_dev -c "SELECT set_config('app.role','hq',false);"
          PGPASSWORD=medini_dev_password psql -h localhost -U medini -d medini_dev -c "SHOW server_version;"
      - name: Probe set_config via pg driver (pre-migration)
        run: |
          sudo apt-get install -y -qq nodejs npm
          mkdir -p /tmp/probe && cd /tmp/probe && npm init -y >/dev/null 2>&1 && npm install pg@8 >/dev/null 2>&1
          node -e "
          const { Client } = require('/tmp/probe/node_modules/pg');
          (async () => {
            const c = new Client({ connectionString: 'postgres://medini:medini_dev_password@localhost:5432/medini_dev' });
            try {
              await c.connect();
              const r = await c.query(\"SELECT set_config('app.role','hq',false)\");
              console.log('PG-DRIVER OK', JSON.stringify(r.rows));
              await c.end();
            } catch (e) {
              console.log('PG-DRIVER FAIL code=' + e.code + ' severity=' + e.severity + ' routine=' + e.routine + ' msg=' + e.message);
              process.exit(1);
            }
          })();
          "

# Development / test orchestration ONLY. Not production.
# PostgreSQL + Redis are provided for local dev; NOT treated as production DB.
services:
  backend:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://medini:***@postgres:5432/medini_dev
      DATABASE_RUNTIME_URL: postgres://medini_app:***@postgres:5432/medini_dev
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev_only_insecure_jwt_secret_change_me
      JWT_REFRESH_SECRET: dev_only_insecure_refresh_secret_change_me
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app
      - /app/node_modules

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: medini
      POSTGRES_PASSWORD: medini_dev_password
      POSTGRES_DB: medini_dev
    ports:
      - "5433:5432"   # host 5433 (avoids clash with native PG on 5432)
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
